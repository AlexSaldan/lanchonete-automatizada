spring:
  application:
    name: lanchonete-automatizada

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lanchonete_automatizada}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
